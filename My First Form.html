<html>
<head>
<title> Student Registration Form </title>
</head>
<body>
<h2> Student Registration Form </h2>
<form>
First Name:
<input type="text" name="first name">
<br><br>
Middle Name:
<input type="text" name="middle name">
<br><br>
Last Name:
<input type="text" name="last name">
<br><br>
Email:
<input type="email" name="email">
<br><br>
Gender:
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>
Hobbies:
<input type="checkbox">Reading
<input type="checkbox">Sports
<input type="checkbox">Travelling
<br><br>

Branch:
<select>
<option> Choose your branch</option>
<option>Computer Science And Engineering </option>
<option>Information Technology </option>
<option>Electronics Enginerring </option>
</select>

Year:
<select>
<option> Choose your year</option>
<option>1st YEAR</option>
<option>2nd YEAR</option>
<option>3rd YEAR</option>
<option>4th YEAR</option>
</select>

Semester:
<select>
<option> Choose your semester</option>
<option>SEMESTER I</option>
<option>SEMESTER II</option>
</select>

Section:
<select>
<option> Choose your section</option>
<option> SECTION A </option>
<option>SECTION B</option>
<option>SECTION C</option>
<option>SECTION D</option>
<option>SECTION E </option>
</select>

<br><br>
Address:<br>
<textarea rows="4" cols="30"></textarea>
<br><br><br>
<input type="Submit" value="Register">
</form>
</body>
</html>
