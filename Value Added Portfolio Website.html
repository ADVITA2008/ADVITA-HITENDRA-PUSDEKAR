<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }

    nav {
      background: #222;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 30px;
      text-align: center;
    }

    /* Gallery Styles */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 15px;
      border: 1px solid #ddd;
      width: 200px;
      text-align: center;
    }

    /* Form Styles */
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      margin: auto;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #333;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#portfolio">Portfolio Gallery</a>
    <a href="#contact">Contact Form</a>
  </nav>

  <section id="home">
    <h1>Welcome to My Portfolio</h1>
    <p>Computer Science Engineering Student &amp; Web Developer</p>
  </section>

  <section id="portfolio">
    <h2>Project Image Gallery</h2>
    <div class="gallery">
      <div class="card">
        <h3>Project 1</h3>
        <p>AI Accessibility App</p>
      </div>
      <div class="card">
        <h3>Project 2</h3>
        <p>Women Safety Web Tool</p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>
</body>
</html>
